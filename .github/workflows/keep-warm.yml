# A free Render instance sleeps after 15 minutes idle, and its cold start was
# measured at 1304ms against a 500ms requirement. A judge opening the submission
# after a quiet night would hit exactly that.
#
# This is a mitigation, not a fix. GitHub's scheduled runs are best effort and
# can be delayed under load. The actual fix is the Starter plan, which does not
# sleep at all. Keep both until the plan is upgraded.
name: keep hearth warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the service and report the round trip
        run: |
          for i in 1 2 3; do
            ms=$( { /usr/bin/time -f "%e" curl -sf -o /dev/null \
                    https://hearth-sh3u.onrender.com/healthz ; } 2>&1 ) && {
              echo "healthz ok in ${ms}s"; exit 0; }
            sleep 5
          done
          echo "hearth did not answer after 3 attempts"; exit 1
