<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 241 241" width="241" height="241">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241b16"/>
      <stop offset="1" stop-color="#140f0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.86" r="0.55">
      <stop offset="0" stop-color="#ff8a4f" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#e0501d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e0501d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="241" height="241" rx="52" fill="url(#bg)"/>

  <!-- the hearth: an arch, the opening of a fireplace -->
  <path d="M62 186 V108 a58.5 58.5 0 0 1 117 0 V186"
        fill="none" stroke="#ff7a45" stroke-width="13" stroke-linecap="round"/>

  <!-- the fire inside it -->
  <ellipse cx="120.5" cy="182" rx="62" ry="40" fill="url(#glow)"/>
  <path d="M120.5 176 c-13-11-17-23-9-36 2 8 6 12 11 14 -4-14 1-26 14-34
           -2 12 3 18 10 25 5 5 8 12 8 19 0 14-14 22-34 12z"
        fill="#ffb06a"/>

  <!-- the floor it stands on -->
  <rect x="52" y="186" width="137" height="12" rx="6" fill="#ff7a45"/>
</svg>
