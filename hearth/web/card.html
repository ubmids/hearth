  Hearth's MCP App view (MCP Apps, io.modelcontextprotocol/ui, 2026-01-26).

  One self-contained file, no network, as the Alexa+ layout guide asks: it runs
  in a sandboxed iframe with no storage and talks to the host only over the
  postMessage bridge. It draws the `card` in a tool result's structuredContent
  using the two patterns Alexa+ allows for this kind of content, Card and List,
  sized for the 768x480 base canvas of an Echo Show.

  Every card is drawn as a label (design/DESIGN.md, direction C). A dose is a
  medicine label: solid black header, the person and the drug. Everything else
  is a household label: outlined header, blue "For the family". Red is only
  ever a refusal. The label kind and its sticker are read from the card's own
  fields; the server's data is drawn as sent.

  The type is IBM Plex Sans Condensed and IBM Plex Mono (SIL Open Font
  Licence), Latin subset, embedded below so the view needs no network.

  :root{
    --desk:#ECECE7; --paper:#FFFFFF; --rule:#111111; --ink:#0B0B0B; --ink-2:#3A3A3A; --ink-3:#595954;
    --red:#C8201A; --on-red:#FFFFFF; --red-tint:#FCE9E7; --yellow:#FFD43B; --on-yellow:#0B0B0B;
    --blue:#1F4FB5; --on-blue:#FFFFFF; --green:#006B47; --on-green:#FFFFFF;
    /* Sizes on the 768x480 canvas, scaled to whatever the host gives us. */
    --u:min(calc(100vw / 768), calc(100vh / 480));
    --f-head:calc(var(--u) * 18); --f-title:calc(var(--u) * 46); --f-body:calc(var(--u) * 24);
    --f-row:calc(var(--u) * 22); --f-meta:calc(var(--u) * 18); --pad:calc(var(--u) * 22);
    --b:calc(var(--u) * 3); --r:calc(var(--u) * 2); --mk:calc(var(--u) * 26);
  }
  body.dark{
    --desk:#0B0B0B; --paper:#161616; --rule:#EDEDE8; --ink:#F5F5F0; --ink-2:#C8C8C2; --ink-3:#A0A09A;
    --red:#FF5A4E; --on-red:#140303; --red-tint:#3A1411; --blue:#8DB0FF; --on-blue:#0B0B0B;
    --green:#4FD19A; --on-green:#04140D;
  }
  /* A phone in portrait: the card is read at arm's length, not across a room. */

  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
    font-family:"Plex Condensed","IBM Plex Sans Condensed","Arial Narrow",sans-serif;
    -webkit-font-smoothing:antialiased}
  .mono{font-family:"Plex Mono","IBM Plex Mono",ui-monospace,monospace}
  .label{height:100vh;display:flex;flex-direction:column;border:var(--b) solid var(--rule);background:var(--paper)}
  body.flow .label{height:auto}
  .lh{display:flex;justify-content:space-between;align-items:center;gap:var(--pad);
      padding:calc(var(--pad) * .45) var(--pad);font-size:var(--f-head);font-weight:700;
      letter-spacing:.06em;text-transform:uppercase;line-height:1.1;flex:none}
  .lh span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .med .lh{background:var(--rule);color:var(--paper)}
  .home .lh{border-bottom:var(--b) solid var(--rule)}
  .lb{flex:1;min-height:0;display:flex;flex-direction:column;padding:calc(var(--pad) * .7) var(--pad) 0}
  .top{display:flex;align-items:flex-start;gap:calc(var(--pad) * .8);justify-content:space-between}
  h1{margin:0;font-size:var(--f-title);line-height:1.04;font-weight:700;letter-spacing:-.005em}
  h1.long{font-size:calc(var(--f-title) * .86)}
  .stk{flex:none;display:inline-block;font-size:var(--f-head);font-weight:700;letter-spacing:.06em;
       text-transform:uppercase;line-height:1;padding:calc(var(--u) * 9) calc(var(--u) * 12);margin-top:calc(var(--u) * 6);white-space:nowrap}
  .stk.red{background:var(--red);color:var(--on-red)}
  .stk.green{background:var(--green);color:var(--on-green)}
  .stk.blue{background:var(--blue);color:var(--on-blue)}
  .stk.yel{background:var(--yellow);color:var(--on-yellow)}
  .stk.out{box-shadow:inset 0 0 0 var(--r) var(--rule);color:var(--ink)}
  .body{margin:calc(var(--u) * 6) 0 0;font-size:var(--f-body);line-height:1.25;color:var(--ink-2)}
  /* One grid for all rows, so every fact starts on the same line. */
  .rows{list-style:none;margin:calc(var(--pad) * .6) 0 0;padding:0;flex:1;min-height:0;overflow:hidden;
        display:grid;grid-template-columns:var(--mk) fit-content(32%) minmax(0,1fr);align-content:start}
  .rows li{display:contents;font-size:var(--f-row);line-height:1.25}
  .rows li > span{padding:calc(var(--u) * 9) 0;border-top:var(--r) solid var(--rule);font-size:var(--f-row);line-height:1.25}
  .rows li > .k{padding-left:calc(var(--u) * 12);padding-right:calc(var(--u) * 16)}
  .rows li.refused > span{background:var(--red-tint)}
  .tight .rows li > span{padding:calc(var(--u) * 5) 0;line-height:1.18}
  .tight .rows li > .k{padding-left:calc(var(--u) * 12);padding-right:calc(var(--u) * 16)}
  .tight .lf{margin-top:calc(var(--u) * 4);padding-top:calc(var(--u) * 5);padding-bottom:calc(var(--u) * 5)}
  .tight .lf .t{-webkit-line-clamp:1}
  .tight .rows{margin-top:calc(var(--pad) * .4)}
  .k{font-weight:700;min-width:0}
  .v{min-width:0}
  .list .v .d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .flow .list .v .d,.flow .lf .t{display:block;-webkit-line-clamp:unset;overflow:visible}
  .meta{display:block;font-size:var(--f-meta);color:var(--ink-3);margin-top:calc(var(--u) * 2)}
  .over .d{text-decoration:line-through;color:var(--ink-3)}
  .chip{display:inline-block;background:var(--yellow);color:var(--on-yellow);font-size:var(--f-head);font-weight:700;
        letter-spacing:.05em;text-transform:uppercase;padding:calc(var(--u) * 5) calc(var(--u) * 8);line-height:1;white-space:nowrap}
  .mk svg{width:var(--mk);height:var(--mk);display:block;margin-top:calc(var(--u) * 1)}
  .more{font-size:var(--f-meta);color:var(--ink-3);padding:calc(var(--u) * 6) 0 0;border-top:var(--r) solid var(--rule);flex:none}
  button{font:inherit;font-size:var(--f-row);font-weight:700;color:var(--paper);background:var(--rule);
         border:0;border-radius:0;padding:calc(var(--u) * 12) calc(var(--u) * 22);margin:calc(var(--u) * 10) 0 0;cursor:pointer;align-self:flex-start}
  .lf{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--pad);flex:none;
      margin-top:calc(var(--u) * 10);padding:calc(var(--u) * 8) var(--pad);border-top:var(--r) solid var(--rule);
      font-size:var(--f-meta);color:var(--ink-3);line-height:1.2}
  .lf .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .lf .mono{white-space:nowrap;flex:none}
  .empty{padding:var(--pad);font-size:var(--f-body)}
  /* A phone in portrait: the card is read at arm's length, not across a room,
     so each fact sits under its heading instead of beside it. */
  @media (max-width:560px){
    body:not(.show){--u:1px; --f-head:13px; --f-title:28px; --f-body:18px; --f-row:17px; --f-meta:14px;
          --pad:14px; --b:2px; --r:1.5px; --mk:20px}
    body:not(.show) .top{flex-direction:column-reverse;align-items:flex-start;gap:8px}
    body:not(.show) .rows{grid-template-columns:var(--mk) minmax(0,1fr)}
    body:not(.show) .rows li > .mk{grid-row:span 2}
    body:not(.show) .rows li > .k,body:not(.show) .rows li > .v{grid-column:2;padding-left:10px;padding-right:0}
    body:not(.show) .rows li > .k{padding-bottom:2px}
    body:not(.show) .rows li > .v{border-top:0;padding-top:0}
    body:not(.show) .lf{flex-direction:column;align-items:flex-start;gap:4px}
    body:not(.show) .home .lh i{display:none}
    body:not(.show) .lh span:last-child{white-space:normal;text-align:right}
  }
  .lh i{font-style:normal}
  @media (prefers-reduced-motion:no-preference){
    .label{animation:in .22s ease-out}
    @keyframes in{from{opacity:0;transform:translateY(6px)}}
  }
</style>
<body>
<div id="root" class="empty">Hearth</div>
<script>
(() => {
  const root = document.getElementById("root");
  let nextId = 1;
  const pending = {};

  function send(msg) { window.parent.postMessage(msg, "*"); }
  function request(method, params) {
    const id = nextId++;
    send({jsonrpc: "2.0", id, method, params});
    return new Promise(res => { pending[id] = res; });
  }
  function notify(method, params) { send({jsonrpc: "2.0", method, params}); }

  const esc = s => String(s ?? "").replace(/[&<>"]/g,
    c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

  // Row marks: a glyph for every status, so nothing rests on colour alone.
  const SQ = '<rect x="1.5" y="1.5" width="21" height="21" fill="none" stroke="var(--rule)" stroke-width="2"/>';
  const MARK = {
    done: '<svg viewBox="0 0 24 24"><rect width="24" height="24" fill="var(--green)"/><path d="M6 12.5l4 4L18 8" fill="none" stroke="var(--on-green)" stroke-width="2.8" stroke-linecap="square"/></svg>',
    refused: '<svg viewBox="0 0 24 24"><rect width="24" height="24" fill="var(--red)"/><path d="M7.5 7.5l9 9M16.5 7.5l-9 9" stroke="var(--on-red)" stroke-width="2.8"/></svg>',
    attention: '<svg viewBox="0 0 24 24">' + SQ + '<path d="M12 6.5v7" stroke="var(--ink)" stroke-width="2.8"/><rect x="10.6" y="15.6" width="2.8" height="2.8" fill="var(--ink)"/></svg>',
    info: '<svg viewBox="0 0 24 24">' + SQ + '<rect x="9.5" y="9.5" width="5" height="5" fill="var(--ink)"/></svg>',
    over: '<svg viewBox="0 0 24 24">' + SQ + '<path d="M7 12h10" stroke="var(--ink-3)" stroke-width="2.4"/></svg>',
  };
  // The record names tools; a family reads what was done.
  const DID = {remember: "Remembered", whats_true: "Checked a rule", did: "Reported", why: "Explained",
    stand_down: "Stood down", end_context: "Ended", household: "Household", check_dose: "Dose question",
    give_dose: "Dose", arrange: "Arranged", reorder: "Priced an order", handover: "Handover",
    shopping_list: "Shopping list", catch_up: "Catch-up", record: "The record",
    "checkout.complete": "Paid", "checkout.create": "Checkout", "checkout.cancel": "Cancelled"};

  function kindOf(c) {
    if (/medicine/i.test(c.title || "")) return "med";
    const m = String(c.eyebrow || "").match(/^(.+?) · (.+)$/);
    return m && !/pharmacy|order/i.test(m[1]) && !/sandbox/i.test(m[2]) ? "med" : "home";
  }

  function sticker(c, kind) {
    const t = c.tone || "info", eb = String(c.eyebrow || "").toLowerCase(), items = c.items || [];
    if (kind === "med") {
      if (t === "stop") return ["red", "Stopped"];
      if (t === "ok") return ["green", /logged/i.test(c.title || "") ? "Logged" : "Taken today"];
      return ["out", /not taken/i.test(c.title || "") ? "Not yet today" : "Check first"];
    }
    if (eb === "the record") return t === "stop" ? ["out", "Check failed"] : ["green", "Intact"];
    if (t === "stop") return ["red", "Refused"];
    if (/order placed/.test(eb)) return ["green", "Paid"];
    const won = items.find(i => i.status === "won");
    if (won) return ["yel", String(won.label || "").replace(/ said$/, "") + "'s rule"];
    if (t === "warn") {
      const f = items.find(i => i.status === "needs_attention");
      const who = f && String(f.detail || "").match(/\bfor ([A-Z][a-z]+)/);
      return ["out", who ? "Needs " + who[1] : "Check first"];
    }
    return ["blue", "For the family"];
  }

  function header(c, kind) {
    const eb = String(c.eyebrow || "");
    if (kind === "med") {
      const m = eb.match(/^(.+?) · (.+)$/);
      return [["Hearth", ` · for ${m ? m[1] : eb || "the family"}`], m ? m[2] : "Medicine"];
    }
    return [["Hearth", " · household"], eb];
  }

  function row(i, refusalCard, overruling) {
    let st = i.status || "info";
    let mark = st === "done" || st === "won" ? "done" : st === "needs_attention" ? "attention" : "info";
    let cls = "";
    if (st === "lost") {
      // "lost" is a refusal unless the card is weighing one person's word
      // against another's: then it is a preference that was overruled.
      if (overruling) { mark = "over"; cls = "over"; } else { mark = "refused"; cls = "refused"; }
    }
    let label = esc(i.label), detail = esc(i.detail);
    const rec = String(i.label || "").match(/^#(\d+) (\S+)$/);
    if (rec) label = `#${rec[1]} ${esc(DID[rec[2]] || rec[2])}`;
    if (i.label === "The rule") {
      const s = String(i.detail || "").match(/^([A-Z][a-z]+) set it (.*)$/);
      label = `<span class="chip">Rule${s ? " · " + esc(s[1]) : ""}</span>`;
      if (s) detail = esc("Set it " + s[2]);
    }
    return `<li class="${cls}"><span class="mk">${MARK[mark]}</span><span class="k">${label}</span>
      <span class="v"><span class="d">${detail}</span>${i.meta ? `<span class="meta">${esc(i.meta)}</span>` : ""}</span></li>`;
  }

  let last = null, resizing = 0;
  // The host may resize the view (a rotated phone, a resized window): draw the
  // label again so the rows that fit are counted afresh.
  window.addEventListener("resize", () => {
    clearTimeout(resizing);
    resizing = setTimeout(() => { if (last) render(last); }, 120);
  });

  function render(result) {
    last = result;
    const sc = (result && result.structuredContent) || {};
    const c = sc.card;
    if (!c) {
      root.className = "empty";
      root.textContent = sc.speech || ((result.content || [])[0] || {}).text || "";
      return;
    }
    const kind = kindOf(c), items = c.items || [];
    const overruling = items.some(i => i.status === "won");
    const [tone, word] = sticker(c, kind);
    const [hl, hr] = header(c, kind);
    const rec = sc.record ? `<span class="mono">Record #${esc(sc.record.seq)} · ${esc(String(sc.record.hash).slice(0, 8))}</span>` : "";
    const title = String(c.title || "");
    root.className = `label ${kind} ${c.pattern === "list" ? "list" : "card"}`;
    root.innerHTML = `
      <div class="lh"><span>${esc(hl[0])}<i>${esc(hl[1])}</i></span><span>${esc(hr)}</span></div>
      <div class="lb">
        <div class="top"><h1 class="${title.length > 30 ? "long" : ""}">${esc(title)}</h1><span class="stk ${tone}">${esc(word)}</span></div>
        ${c.body ? `<p class="body">${esc(c.body)}</p>` : ""}
        <ul class="rows">${items.map(i => row(i, c.tone === "stop", overruling)).join("")}</ul>
        ${c.cta ? `<button id="cta">${esc(c.cta.label)}</button>` : ""}
      </div>
      <div class="lf"><span class="t">${esc(c.footer || "")}</span>${rec}</div>`;
    fit();
    const b = document.getElementById("cta");
    if (b) b.onclick = () => request("ui/message", {
      role: "user", content: {type: "text", text: c.cta.message},
      _meta: {checkout: c.cta.checkout}});
    notify("ui/notifications/size-changed",
           {width: document.body.scrollWidth, height: document.body.scrollHeight});
  }

  // A label never clips a row in half: rows that do not fit are counted
  // instead, and the count says where the rest are.
  function fit() {
    const ul = root.querySelector(".rows");
    if (!ul || document.body.classList.contains("flow")) return;
    const over = () => ul.scrollHeight > ul.clientHeight + 1;
    if (over()) root.classList.add("tight");
    let hidden = 0, m = null;
    while (ul.children.length > 1 && over()) {
      ul.removeChild(ul.lastElementChild); hidden++;
      if (!m) { m = document.createElement("div"); m.className = "more"; ul.after(m); }
      m.textContent = `${hidden} more ${hidden === 1 ? "line" : "lines"}: ask Hearth to read them`;
    }
  }

  window.addEventListener("message", ev => {
    const m = ev.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id && pending[m.id]) { pending[m.id](m.result); delete pending[m.id]; return; }
    if (m.method === "ui/notifications/tool-result") render(m.params);
    if (m.method === "ui/notifications/host-context-changed") theme(m.params);
  });

  function theme(ctx) {
    if (!ctx) return;
    if (ctx.theme) document.body.classList.toggle("dark", ctx.theme === "dark");
    // A phone host lets the card take the height it needs.
    if (ctx.displayMode === "flow" || ctx.deviceClass === "phone") document.body.classList.add("flow");
    // An Echo Show keeps the 768x480 canvas, scaled, however small it is drawn.
    if (/^echo-show/.test(ctx.deviceClass || "")) document.body.classList.add("show");
  }

  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: {name: "hearth-card", version: "2.0.0"},
    appCapabilities: {}
  }).then(r => { theme(r && r.hostContext); notify("ui/notifications/initialized", {}); });
})();
</script>
</body>
</html>
