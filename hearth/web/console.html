<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearth</title>
<style>
  :root{
    --bg:#14100e; --panel:#1b1614; --panel2:#221b17; --line:#302722;
    --ink:#f2e9e1; --muted:#a4907f; --dim:#6f5f54;
    --ember:#ff7a45; --ember-dim:#8a3f22;
    --win:#86cf97; --lose:#7a6459;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif;
       -webkit-font-smoothing:antialiased}
  a{color:var(--ember)}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
         padding:22px 28px 18px;border-bottom:1px solid var(--line)}
  .mark{font-size:19px;font-weight:640;letter-spacing:-.015em}
  .mark span{color:var(--ember)}
  .tag{font:11px/1 var(--mono);color:var(--dim);border:1px solid var(--line);
       border-radius:999px;padding:5px 9px;letter-spacing:.06em;text-transform:uppercase}
  .strap{color:var(--muted);font-size:13.5px;margin-left:auto;max-width:46ch;text-align:right}

  /* Three panes that each scroll on their own, so the say box stays pinned to
     the bottom of the middle pane instead of floating over a card, and every
     column rule runs the full height of the window. */
  main{display:grid;grid-template-columns:272px minmax(0,1fr) 330px;
       height:calc(100vh - 74px);overflow:hidden}
  aside,.right{padding:22px 24px;overflow-y:auto;min-width:0}
  aside{border-right:1px solid var(--line)}
  .right{border-left:1px solid var(--line)}
  .mid{display:flex;flex-direction:column;min-width:0;min-height:0;padding:0}
  .mid h2{padding:22px 26px 0;margin-bottom:14px}
  .scroll{flex:1;overflow-y:auto;padding:0 26px 4px;min-height:0}
  h2{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
     margin:0 0 14px;font-weight:600}
  h2+h2{margin-top:30px}

  .who{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .who:last-child{border-bottom:0}
  .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
       background:var(--panel2);border:1px solid var(--line);
       font:11px/1 var(--mono);color:var(--muted);flex:none}
  .who b{font-weight:560}
  .who small{display:block;color:var(--dim);font-size:12px}
  .owns{color:var(--ember);font:11px/1.4 var(--mono)}

  .ctx{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--ember-dim);
       border-radius:0 7px 7px 0;padding:10px 12px;margin-bottom:9px}
  .ctx b{font-weight:560;font-size:13.5px}
  .ctx small{display:block;color:var(--dim);font:11.5px/1.6 var(--mono);margin-top:3px}

  .slot{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:17px 19px;margin-bottom:13px}
  .slot-top{display:flex;align-items:flex-start;gap:14px}
  .slot-name{font:12px/1 var(--mono);color:var(--muted);letter-spacing:.02em}
  .slot-about{color:var(--ember);font:11px/1 var(--mono)}
  .val{font-size:29px;font-weight:620;letter-spacing:-.025em;margin:7px 0 0;line-height:1}
  .said{color:var(--muted);font-size:13.5px;margin:9px 0 0}
  .said b{color:var(--ink);font-weight:560}
  .basis{margin-left:auto;flex:none;font:10px/1 var(--mono);letter-spacing:.09em;
         text-transform:uppercase;color:var(--dim);border:1px solid var(--line);
         border-radius:999px;padding:5px 8px}
  .contest{margin-top:13px;border-top:1px dashed var(--line);padding-top:11px}
  .row{display:flex;gap:9px;align-items:baseline;font-size:13px;padding:3px 0}
  .row .v{font:12px/1.4 var(--mono);color:var(--lose);min-width:58px}
  .row .r{color:var(--dim)}
  .row.w .v{color:var(--win)}
  .acts{margin-top:13px;display:flex;gap:8px;flex-wrap:wrap}

  button{font:inherit;font-size:12.5px;color:var(--ink);background:var(--panel2);
         border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer}
  button:hover{border-color:var(--ember-dim);color:var(--ember)}
  button.primary{background:var(--ember);border-color:var(--ember);color:#1a0e08;font-weight:600}
  button.primary:hover{color:#1a0e08;filter:brightness(1.08)}
  button.ghost{background:none;color:var(--dim);border-color:transparent;padding:5px 7px}
  button.ghost:hover{color:var(--ember);border-color:var(--line)}

  .say{flex:none;padding:14px 26px 20px;border-top:1px solid var(--line);
       background:var(--bg)}
  .saybox{display:flex;gap:9px;background:var(--panel);border:1px solid var(--line);
          border-radius:10px;padding:9px}
  select,input[type=text]{font:inherit;background:transparent;border:0;color:var(--ink);outline:0}
  select{color:var(--ember);font:12.5px/1 var(--mono);border-right:1px solid var(--line);
         padding-right:10px;cursor:pointer}
  select option{background:var(--panel2)}
  input[type=text]{flex:1;font-size:14.5px}
  input::placeholder{color:var(--dim)}
  .reply{color:var(--muted);font-size:13px;margin:11px 2px 0;min-height:1.5em}
  .reply b{color:var(--ember);font-weight:560}

  .act{border-bottom:1px solid var(--line);padding:11px 0}
  .act:last-child{border-bottom:0}
  .act b{font-weight:560;font-size:13.5px;display:block}
  .act small{color:var(--dim);font-size:12.5px;display:block;margin-top:4px}
  .act time{font:10.5px/1 var(--mono);color:var(--dim)}

  .belief{display:flex;gap:9px;align-items:baseline;padding:6px 0;font-size:12.5px;
          border-bottom:1px solid var(--line);min-width:0}
  .belief .k{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .belief .n{color:var(--dim);flex:none;max-width:7ch;overflow:hidden;
             text-overflow:ellipsis;white-space:nowrap}
  .belief:last-child{border-bottom:0}
  .belief .s{font:10px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;
             color:var(--dim);min-width:52px}
  .belief.dead{color:var(--dim)}
  .belief.dead .k{text-decoration:line-through}
  .k{font:12px/1.5 var(--mono)}
  .empty{color:var(--dim);font-size:13px;font-style:italic}
  @media (max-width:1080px){
    main{grid-template-columns:1fr;height:auto;overflow:visible}
    aside,.right{border:0;border-top:1px solid var(--line);overflow:visible}
    .mid{padding:0 0 8px}
    .scroll{overflow:visible;padding:0 20px}
    .mid h2{padding:22px 20px 0}
    .say{position:sticky;bottom:0;padding:12px 20px 16px}
    .strap{margin-left:0;text-align:left}
  }
</style>

<header>
  <div class="mark">Hearth<span>.</span></div>
  <div class="tag" id="proto">mcp 2025-11-25</div>
  <div class="strap">The household memory an agent can be trusted with. Who said it,
    when, whether it still holds, and why it won.</div>
</header>

<main>
  <aside>
    <h2>Who lives here</h2>
    <div id="members"></div>
    <h2>Open situations</h2>
    <div id="contexts"></div>
    <h2>Everything ever said</h2>
    <div id="beliefs"></div>
  </aside>

  <div class="mid">
    <h2>What is standing right now</h2>
    <div class="scroll"><div id="slots"></div></div>
    <div class="say">
      <div class="saybox">
        <select id="speaker"></select>
        <input type="text" id="said" autocomplete="off"
               placeholder="say something, the way you would out loud">
        <button class="primary" id="send">Say</button>
      </div>
      <div class="reply" id="reply"></div>
    </div>
  </div>

  <div class="right">
    <h2>What it did, and why</h2>
    <div id="ledger"></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let TOKEN = null, STATE = null;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const ago = t => {
  const s = Date.now()/1000 - t;
  for (const [u,n] of [["week",604800],["day",86400],["hour",3600],["min",60]])
    if (s >= n) { const v = Math.floor(s/n); return `${v} ${u}${v>1?"s":""} ago`; }
  return "just now";
};

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: {"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined,
  });
  return r.json();
}

function render(s) {
  STATE = s;

  $("#members").innerHTML = s.members.map(m => `
    <div class="who">
      <div class="dot">${esc(m.name.slice(0,2).toUpperCase())}</div>
      <div><b>${esc(m.name)}</b>
        <small>${esc(m.role)}${m.grants.length ? "" : " · no domain of their own"}</small>
        ${m.grants.length ? `<div class="owns">owns ${m.grants.map(esc).join(", ")}</div>` : ""}
      </div>
    </div>`).join("");

  $("#contexts").innerHTML = s.contexts.length ? s.contexts.map(c => `
    <div class="ctx"><b>${esc(c.name)}</b>
      <small>${c.riding.map(esc).join("<br>")}</small></div>`).join("")
    : `<div class="empty">Nothing is riding on a situation.</div>`;

  $("#slots").innerHTML = s.slots.length ? s.slots.map(x => `
    <div class="slot">
      <div class="slot-top">
        <div>
          <div class="slot-name">${esc(x.domain)}.${esc(x.slot)}
            ${x.about ? `<span class="slot-about">· for ${esc(x.about)}</span>` : ""}</div>
          <div class="val">${esc(x.value)}</div>
        </div>
        ${x.losers.length ? `<div class="basis">won on ${esc(x.basis)}</div>` : ""}
      </div>
      <p class="said">${esc(x.sentence)}</p>
      ${x.losers.length ? `
        <div class="contest">
          <div class="row w"><span class="v">${esc(x.value)}</span>
            <span class="r">${esc(x.winner.holder)}, ${ago(x.winner.stated_at)}${
              x.winner.context ? `, during ${esc(x.winner.context)}` : ""}</span></div>
          ${x.losers.map(l => `<div class="row"><span class="v">${esc(l.value)}</span>
            <span class="r">${esc(l.holder)}, but ${esc(l.reason)}</span></div>`).join("")}
        </div>` : ""}
      <div class="acts">
        <button onclick="act('${x.domain}','${x.slot}',${x.about ? `'${esc(x.about)}'` : "null"})">
          Act on this</button>
        ${x.losers.map(l => `<button class="ghost" onclick="retire('${l.id}')">
          stand down ${esc(l.holder)}'s ${esc(l.value)}</button>`).join("")}
      </div>
    </div>`).join("")
    : `<div class="empty">Nobody has said anything yet. Try
       "keep it at 19" as Dad, then "make it 23" as Ada.</div>`;

  $("#beliefs").innerHTML = s.beliefs.slice().reverse().map(b => `
    <div class="belief ${b.live ? "" : "dead"}">
      <span class="s">${b.live ? "live" : esc(b.status)}</span>
      <span class="k">${esc(b.domain)}.${esc(b.slot)}=${esc(b.value)}</span>
      <span class="n">${esc(b.holder_name)}</span>
    </div>`).join("") || `<div class="empty">Nothing yet.</div>`;

  $("#ledger").innerHTML = s.actions.length ? s.actions.map(a => `
    <div class="act">
      <b>${esc(a.what)}</b>
      <small>${esc(a.why || "no recorded basis")}</small>
      <time>${ago(a.at)}</time>
    </div>`).join("")
    : `<div class="empty">It has not acted yet.</div>`;

  const sel = $("#speaker"), keep = sel.value;
  sel.innerHTML = s.members.map(m => `<option>${esc(m.name)}</option>`).join("");
  if (keep) sel.value = keep;
}

async function say() {
  const said = $("#said").value.trim();
  if (!said) return;
  $("#said").value = "";
  const r = await api("/api/say", {said, speaker: $("#speaker").value});
  $("#reply").innerHTML = "<b>&rsaquo;</b> " + esc(r.reply);
  render(r.state);
}

async function act(domain, slot, about) {
  const r = await api("/api/act", {domain, slot, about});
  $("#reply").innerHTML = "<b>&rsaquo;</b> " + esc(r.reply) +
    (r.why ? `<br><b>why?</b> ${esc(r.why)}` : "");
  render(r.state);
}

async function retire(id) {
  const r = await api("/api/retire", {belief_id: id});
  $("#reply").innerHTML = "<b>&rsaquo;</b> " + esc(r.reply);
  render(r.state);
}

$("#send").onclick = say;
$("#said").addEventListener("keydown", e => { if (e.key === "Enter") say(); });

(async () => {
  const t = await (await fetch("/api/console-token")).json();
  if (t.error) { document.body.innerHTML =
    `<p style="padding:40px;color:#a4907f">${t.error}</p>`; return; }
  TOKEN = t.access_token;
  render(await api("/api/state"));
})();
</script>
