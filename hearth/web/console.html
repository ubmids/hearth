<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearth · Household board</title>
<!-- The household board: everything Hearth holds for Rose's house, drawn as
     labels (design/DESIGN.md, direction C). Every sentence arrives already
     written by the server; this page only lays it out. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --desk:#ECECE7; --paper:#FFFFFF; --line:#D2D2CB; --rule:#111111; --ink:#0B0B0B; --ink-2:#3A3A3A; --ink-3:#595954;
    --red:#C8201A; --on-red:#FFFFFF; --red-tint:#FCE9E7; --yellow:#FFD43B; --on-yellow:#0B0B0B;
    --blue:#1F4FB5; --on-blue:#FFFFFF; --green:#006B47; --on-green:#FFFFFF;
    --sans:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--desk);color:var(--ink);font:17px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
  a{color:var(--ink)}
  button,select,input{font-family:var(--sans)}
  .caps{text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  header{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding:12px 24px;background:var(--paper);border-bottom:3px solid var(--rule)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:26px}
  .brand svg{width:26px;height:26px}
  .title{font-size:20px;font-weight:600;color:var(--ink-2)}
  .grow{flex:1}
  .meta{color:var(--ink-3);font-size:15px}
  .sim{font-size:15px;font-weight:600;border:2px solid var(--rule);padding:7px 12px;text-decoration:none;white-space:nowrap}

  main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,1.1fr);gap:24px;padding:24px;align-items:start}
  .col{display:flex;flex-direction:column;gap:24px;min-width:0}

  /* a label: paper, a 3 px rule, a caps header */
  .label{background:var(--paper);border:3px solid var(--rule)}
  .lh{display:flex;justify-content:space-between;gap:12px;padding:9px 16px;border-bottom:3px solid var(--rule);font-size:14px}
  .med > .lh{background:var(--rule);color:var(--paper)}
  .lb{padding:4px 16px 12px}
  .row{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1.5px solid var(--rule)}
  .row:first-child{border-top:0}
  .av{width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--rule);font-weight:700;font-size:18px}
  .av.say{background:var(--rule);color:var(--paper)}
  .row b{font-size:19px}
  .row small{display:block;color:var(--ink-3);font-size:15px}
  .row .auth{display:block;color:var(--ink-2);font-size:15.5px;margin-top:2px}
  .empty{color:var(--ink-3);font-size:15.5px;padding:12px 0}

  .stk{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1;padding:6px 8px;white-space:nowrap}
  .stk.red{background:var(--red);color:var(--on-red)}
  .stk.yel{background:var(--yellow);color:var(--on-yellow)}
  .stk.blue{background:var(--blue);color:var(--on-blue)}
  .stk.green{background:var(--green);color:var(--on-green)}
  .stk.out{box-shadow:inset 0 0 0 2px var(--rule);color:var(--ink)}

  /* what stands now: one label per rule */
  .slot .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:10px}
  .val{font-size:34px;font-weight:700;line-height:1.05}
  .said{margin:8px 0 0;font-size:17px;line-height:1.4}
  .contest{margin-top:12px}
  .verdict{margin:0 0 4px;font-size:16px;font-weight:600}
  .crow{display:grid;grid-template-columns:22px minmax(64px,auto) minmax(0,1fr);gap:10px;align-items:baseline;padding:7px 0;border-top:1.5px solid var(--rule);font-size:15.5px}
  .crow .v{font-weight:700}
  .crow.lost .v{text-decoration:line-through;color:var(--ink-3)}
  .crow .r{color:var(--ink-2)}
  .mk{width:18px;height:18px;display:block;align-self:center}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .acts button{font-size:15px;font-weight:600;background:var(--paper);color:var(--ink);border:2px solid var(--rule);padding:6px 12px;cursor:pointer}
  .acts button:hover{background:var(--rule);color:var(--paper)}
  .acts button.ghost{border-color:transparent;text-decoration:underline;padding:6px 4px;font-weight:400}

  /* say something */
  .saybox{display:flex;gap:8px;padding:12px 16px}
  .saybox select{font-size:16px;font-weight:600;border:2px solid var(--rule);background:var(--paper);color:var(--ink);padding:0 8px;border-radius:0}
  .saybox input{flex:1;min-width:0;font-size:17px;border:2px solid var(--rule);padding:10px 12px;outline:none;border-radius:0;color:var(--ink)}
  .saybox input::placeholder{color:var(--ink-3)}
  .saybox button{font-size:16px;font-weight:600;background:var(--rule);color:var(--paper);border:0;padding:0 18px;cursor:pointer}
  .reply{padding:0 16px 12px;font-size:16px;color:var(--ink-2);min-height:0}
  .reply:empty{display:none}

  /* the family board and what Hearth did */
  .note{padding:12px 0;border-top:1.5px solid var(--rule);font-size:16.5px;line-height:1.4}
  .note:first-child{border-top:0}
  .note small{display:block;color:var(--ink-3);font-size:14.5px;margin-bottom:3px}
  .note .stk{margin-top:6px}
  .act{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:11px 0;border-top:1.5px solid var(--rule)}
  .act:first-child{border-top:0}
  .act b{font-weight:600;font-size:16.5px;display:block}
  .act small{display:block;color:var(--ink-2);font-size:15px;margin-top:2px}
  .act time{display:block;font:13px var(--mono);color:var(--ink-3);margin-top:3px}
  .belief{padding:9px 0;border-top:1.5px solid var(--rule)}
  .belief:first-child{border-top:0}
  .belief .q{font-size:16px}
  .belief .m{color:var(--ink-3);font-size:14.5px;margin-top:2px}
  .belief.dead .q{text-decoration:line-through;color:var(--ink-3)}
  .ctx{padding:10px 0;border-top:1.5px solid var(--rule)}
  .ctx:first-child{border-top:0}
  .ctx b{font-size:17px}
  .ctx small{display:block;color:var(--ink-2);font-size:15.5px}
  .rec{font:14px var(--mono);color:var(--ink-3);padding:10px 0 2px}

  @media (max-width:1180px){ main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .col.c3{grid-column:1 / -1} }
  @media (max-width:760px){
    main{grid-template-columns:minmax(0,1fr);padding:16px;gap:16px}
    .col{gap:16px}
    header{padding:10px 16px}
    .title{display:none}
    .saybox{flex-wrap:wrap}
    .saybox input{flex-basis:100%;order:3}
    .saybox select{height:44px}
    .saybox button{height:44px}
  }
</style>

<header>
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 27V14a9 9 0 0 1 18 0v13" fill="none" stroke="currentColor" stroke-width="3.2"/><path d="M4 27.5h24" stroke="currentColor" stroke-width="3.2"/><rect x="13" y="18" width="6" height="9" fill="currentColor"/></svg>hearth</div>
  <div class="title">Household board</div>
  <div class="grow"></div>
  <div class="meta" id="auth">Signing in</div>
  <span class="meta" id="proto">MCP 2025-11-25</span>
  <a class="sim" href="/alexa">Open the simulated Alexa+</a>
</header>

<main>
  <div class="col c1">
    <section class="label">
      <div class="lh caps"><span>Who has the say</span><span>Rose's house</span></div>
      <div class="lb" id="members"></div>
    </section>
    <section class="label">
      <div class="lh caps"><span>Open situations</span></div>
      <div class="lb" id="contexts"></div>
    </section>
    <section class="label">
      <div class="lh caps"><span>Everything ever said</span></div>
      <div class="lb" id="beliefs"></div>
    </section>
  </div>

  <div class="col c2">
    <section class="label say">
      <div class="lh caps"><span>Say something</span><span>As a family member</span></div>
      <div class="saybox">
        <select id="speaker" aria-label="Who is speaking"></select>
        <input type="text" id="said" autocomplete="off" aria-label="What they say"
               placeholder="Say it the way you would out loud">
        <button id="send">Say</button>
      </div>
      <div class="reply" id="reply"></div>
    </section>
    <div id="slots" class="col"></div>
  </div>

  <div class="col c3">
    <section class="label">
      <div class="lh caps"><span>Family board</span><span class="stk blue">For the family</span></div>
      <div class="lb" id="board"></div>
    </section>
    <section class="label">
      <div class="lh caps"><span>What Hearth did, and why</span></div>
      <div class="lb" id="ledger"></div>
    </section>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let TOKEN = null, STATE = null;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const ago = t => {
  const s = Date.now()/1000 - t;
  for (const [u,n] of [["week",604800],["day",86400],["hour",3600],["min",60]])
    if (s >= n) { const v = Math.floor(s/n); return `${v} ${u}${v>1?"s":""} ago`; }
  return "just now";
};

const MK = {
  done: '<svg class="mk" viewBox="0 0 24 24"><rect width="24" height="24" fill="var(--green)"/><path d="M6 12.5l4 4L18 8" fill="none" stroke="var(--on-green)" stroke-width="2.8"/></svg>',
  refused: '<svg class="mk" viewBox="0 0 24 24"><rect width="24" height="24" fill="var(--red)"/><path d="M7.5 7.5l9 9M16.5 7.5l-9 9" stroke="var(--on-red)" stroke-width="2.8"/></svg>',
  over: '<svg class="mk" viewBox="0 0 24 24"><rect x="1.5" y="1.5" width="21" height="21" fill="none" stroke="var(--rule)" stroke-width="2"/><path d="M7 12h10" stroke="var(--ink-3)" stroke-width="2.4"/></svg>',
  info: '<svg class="mk" viewBox="0 0 24 24"><rect x="1.5" y="1.5" width="21" height="21" fill="none" stroke="var(--rule)" stroke-width="2"/><rect x="9.5" y="9.5" width="5" height="5" fill="var(--ink)"/></svg>',
};

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: {"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined,
  });
  return r.json();
}

function render(s) {
  // /api/say and /api/act answer with the household only; the care books and
  // the record stay as last read until the next full state.
  if (STATE && !s.care) s.care = STATE.care;
  if (STATE && !s.record) s.record = STATE.record;
  STATE = s;
  const now = Date.now() / 1000;

  // Nothing below phrases a belief. Every sentence on this page arrives already
  // written by hearth/phrasing.py, because a second rendering here would drift
  // from the one Alexa+ is given and the console would stop being evidence.
  $("#members").innerHTML = s.members.map(m => `
    <div class="row">
      <div class="av ${m.grants.length ? "say" : ""}">${esc(m.name.slice(0,1).toUpperCase())}</div>
      <div><b>${esc(m.name)}</b><small>${esc(m.role)}</small>
        <span class="auth">${esc(m.authority)}</span></div>
    </div>`).join("");

  $("#contexts").innerHTML = s.contexts.length ? s.contexts.map(c => `
    <div class="ctx"><b>While ${esc(c.name)} lasts</b>
      <small>${c.holds.map(esc).join("<br>")}</small></div>`).join("")
    : `<div class="empty">Nothing is riding on a situation.</div>`;

  // One label per rule that stands. A medicine rule gets the medicine label.
  $("#slots").innerHTML = s.slots.length ? s.slots.map(x => `
    <section class="label slot ${String(x.domain).startsWith("medication") ? "med" : ""}">
      <!-- The title already carries the name when a row is about one
           person ("Ada's dinner"), so nothing repeats it here. -->
      <div class="lh caps"><span>${esc(x.title)}</span><span>${String(x.domain).startsWith("medication") ? "Medicine" : "Household"}</span></div>
      <div class="lb">
        <div class="top">
          <!-- The reading is short enough to take in at a glance and short
               enough to be ambiguous read alone, so the sentence goes with it
               for anyone hearing the page rather than looking at it. -->
          <div class="val" title="${esc(x.statement)}" aria-label="${esc(x.statement)}">${esc(x.reading)}</div>
          ${x.losers.length ? `<span class="stk yel">${esc(x.verdict.chip)}</span>` : ""}
        </div>
        <p class="said">${esc(x.sentence)}</p>
        ${x.losers.length ? `
          <div class="contest">
            <p class="verdict">${esc(x.verdict.line)}</p>
            <div class="crow">${MK.done}<span class="v">${esc(x.reading)}</span>
              <span class="r">${esc(x.winner.holder)}, ${ago(x.winner.stated_at)}${
                x.winner.context ? `, during ${esc(x.winner.context)}` : ""}</span></div>
            ${x.losers.map(l => `<div class="crow lost">${MK.over}<span class="v">${esc(l.reading)}</span>
              <span class="r">${esc(l.holder)}, but ${esc(l.reason)}</span></div>`).join("")}
          </div>` : ""}
        <div class="acts">
          <button onclick="act('${x.domain}','${x.slot}',${x.about ? `'${esc(x.about)}'` : "null"})">Act on this now</button>
          ${x.losers.map(l => `<button class="ghost" onclick="retire('${l.id}')">Stand down ${esc(l.holder)}'s ${esc(l.reading)}</button>`).join("")}
        </div>
      </div>
    </section>`).join("")
    : `<section class="label"><div class="lb"><div class="empty">Nothing stands yet. As Ada, try
       "No coffee for Mom after three".</div></div></section>`;

  $("#beliefs").innerHTML = s.beliefs.slice().reverse().map(b => `
    <div class="belief ${b.live ? "" : "dead"}">
      <div class="q">${esc(b.said)}</div>
      <div class="m">${esc(b.holder_name)} · ${esc(b.standing)}</div>
    </div>`).join("") || `<div class="empty">Nothing yet.</div>`;

  const board = (s.care && s.care.board) || [];
  $("#board").innerHTML = board.length ? board.map(p => `
    <div class="note"><small>From ${esc(p.by || "Hearth")}, ${esc(p.when)}${(p.to || []).length ? ` · to ${esc(p.to.join(" and "))}` : ""}</small>
      ${esc(p.text)}
      ${p.pin_until && p.pin_until > now ? `<br><span class="stk out">Pinned for ${esc((p.to || [])[0] || "the family")}</span>` : ""}
    </div>`).join("")
    : `<div class="empty">Nothing on the board yet.</div>`;

  const rec = s.record;
  $("#ledger").innerHTML = (s.actions.length ? s.actions.map(a => `
    <div class="act">${a.outcome === "refused" ? MK.refused : a.source === "reported" ? MK.info : MK.done}
      <div><b>${esc(a.what)}</b>
      <small>${esc(a.why || "No recorded basis.")}</small>
      <time>${ago(a.at)}</time></div>
    </div>`).join("")
    : `<div class="empty">Hearth has not acted yet.</div>`)
    + (rec ? `<div class="rec">The record: ${rec.count} calls, ${rec.intact ? "intact" : "does not hold up"}. Head ${esc(rec.head)}</div>` : "");

  const sel = $("#speaker"), keep = sel.value;
  sel.innerHTML = s.members.map(m => `<option>${esc(m.name)}</option>`).join("");
  if (keep) sel.value = keep;
}

async function say() {
  const said = $("#said").value.trim();
  if (!said) return;
  $("#said").value = "";
  const r = await api("/api/say", {said, speaker: $("#speaker").value});
  // `line` is the same event in the household's words; `reply` is the exact
  // text the MCP tool returned, which is what Alexa+ would hear.
  $("#reply").innerHTML = "<b>Hearth:</b> " + esc(r.line || r.reply);
  render(r.state);
}

async function act(domain, slot, about) {
  const r = await api("/api/act", {domain, slot, about});
  $("#reply").innerHTML = "<b>Hearth:</b> " + esc(r.reply) +
    (r.why ? `<br><b>Why:</b> ${esc(r.why)}` : "");
  render(r.state);
}

async function retire(id) {
  const r = await api("/api/retire", {belief_id: id});
  $("#reply").innerHTML = "<b>Hearth:</b> " + esc(r.reply);
  render(r.state);
}

$("#send").onclick = say;
$("#said").addEventListener("keydown", e => { if (e.key === "Enter") say(); });

// --- getting in --------------------------------------------------------
// The console holds no privileged back door. It authenticates the same way an
// Alexa+ client does, with the OAuth 2.1 authorization code flow and PKCE, in
// the browser. That is not ceremony: the first version minted a token from a
// loopback-only endpoint, which was safe but meant the deployed console showed
// a judge a 403 instead of the product. This works for anyone, from anywhere,
// and exercises the real auth path every time the page loads.

const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

async function challengeFor(verifier) {
  return b64url(await crypto.subtle.digest("SHA-256",
    new TextEncoder().encode(verifier)));
}

function randomVerifier() {
  const a = new Uint8Array(48);
  crypto.getRandomValues(a);
  return b64url(a.buffer);
}

async function connect() {
  const here = location.origin + location.pathname;

  // Coming back from /authorize with a code.
  const code = new URLSearchParams(location.search).get("code");
  if (code) {
    const verifier = sessionStorage.getItem("hearth_verifier") || "";
    history.replaceState({}, "", here);               // keep the code out of the bar
    const r = await fetch("/token", {
      method: "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded"},
      body: new URLSearchParams({
        grant_type: "authorization_code", code, code_verifier: verifier,
        client_id: CLIENT_ID, redirect_uri: here, resource: RESOURCE}),
    });
    const t = await r.json();
    if (t.access_token) {
      sessionStorage.setItem("hearth_token", t.access_token);
      return t.access_token;
    }
    throw new Error(t.error_description || t.error || "token exchange failed");
  }

  // Already holding one from earlier in this tab.
  const saved = sessionStorage.getItem("hearth_token");
  if (saved) {
    const ok = await fetch("/api/state", {headers: {Authorization: "Bearer " + saved}});
    if (ok.status !== 401) return saved;
    sessionStorage.removeItem("hearth_token");
  }

  const verifier = randomVerifier();
  sessionStorage.setItem("hearth_verifier", verifier);
  const q = new URLSearchParams({
    client_id: CLIENT_ID, redirect_uri: here, response_type: "code",
    code_challenge: await challengeFor(verifier), code_challenge_method: "S256",
    resource: RESOURCE, scope: "household.read household.write"});
  location.href = "/authorize?" + q;
  return null;
}

let CLIENT_ID = "hearth-dev-client", RESOURCE = location.origin + "/mcp";

(async () => {
  try {
    const meta = await (await fetch("/.well-known/oauth-protected-resource")).json();
    RESOURCE = meta.resource || RESOURCE;
    const asm = await (await fetch("/.well-known/oauth-authorization-server")).json();
    CLIENT_ID = asm.client_id_hint || CLIENT_ID;

    TOKEN = await connect();
    if (!TOKEN) return;                                // redirecting to /authorize
    $("#auth").textContent = "Signed in with OAuth 2.1 and PKCE";
    render(await api("/api/state"));
  } catch (e) {
    document.body.innerHTML =
      `<p style="padding:40px;font:17px var(--sans)">
         Could not connect: ${esc(String(e.message || e))}</p>`;
  }
})();
</script>
