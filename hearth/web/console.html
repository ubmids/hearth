<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearth</title>
<style>
  :root{
    --bg:#14100e; --panel:#1b1614; --panel2:#221b17; --line:#302722;
    --ink:#f2e9e1; --muted:#a4907f; --dim:#6f5f54;
    --ember:#ff7a45; --ember-dim:#8a3f22;
    --win:#86cf97; --lose:#7a6459;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif;
       -webkit-font-smoothing:antialiased}
  a{color:var(--ember)}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
         padding:22px 28px 18px;border-bottom:1px solid var(--line)}
  .mark{font-size:19px;font-weight:640;letter-spacing:-.015em}
  .mark span{color:var(--ember)}
  .tag{font:11px/1 var(--mono);color:var(--dim);border:1px solid var(--line);
       border-radius:999px;padding:5px 9px;letter-spacing:.06em;text-transform:uppercase}
  .strap{color:var(--muted);font-size:13.5px;margin-left:auto;max-width:46ch;text-align:right}

  /* Three panes that each scroll on their own, so the say box stays pinned to
     the bottom of the middle pane instead of floating over a card, and every
     column rule runs the full height of the window. */
  main{display:grid;grid-template-columns:272px minmax(0,1fr) 330px;
       height:calc(100vh - 74px);overflow:hidden}
  aside,.right{padding:22px 24px;overflow-y:auto;min-width:0}
  aside{border-right:1px solid var(--line)}
  .right{border-left:1px solid var(--line)}
  .mid{display:flex;flex-direction:column;min-width:0;min-height:0;padding:0}
  .mid h2{padding:22px 26px 0;margin-bottom:14px}
  .scroll{flex:1;overflow-y:auto;padding:0 26px 4px;min-height:0}
  h2{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
     margin:0 0 14px;font-weight:600}
  aside h2{margin-top:30px}
  aside h2:first-child{margin-top:0}

  .who{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .who:last-child{border-bottom:0}
  .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
       background:var(--panel2);border:1px solid var(--line);
       font:11px/1 var(--mono);color:var(--muted);flex:none}
  .who b{font-weight:560}
  .who small{display:block;color:var(--dim);font-size:12px}
  .owns{color:var(--ember);font-size:11.5px;line-height:1.4}
  .nosay{color:var(--dim);font-size:11.5px;line-height:1.4}

  .ctx{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--ember-dim);
       border-radius:0 7px 7px 0;padding:10px 12px;margin-bottom:9px}
  .ctx b{font-weight:560;font-size:13.5px}
  .ctx small{display:block;color:var(--muted);font-size:12px;line-height:1.5;margin-top:3px}

  .slot{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:17px 19px;margin-bottom:13px}
  .slot-top{display:flex;align-items:flex-start;gap:14px}
  .slot-name{font-size:12px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
             color:var(--muted)}
  .val{font-size:29px;font-weight:620;letter-spacing:-.025em;margin:7px 0 0;line-height:1}
  /* The explanation is the product, so it is set at reading size in the page's
     own ink rather than as a caption under the number. */
  .said{color:var(--ink);font-size:15px;line-height:1.5;margin:11px 0 0}
  .said b{color:var(--ink);font-weight:560}
  .basis{margin-left:auto;flex:none;font-size:11px;letter-spacing:.04em;
         color:var(--ember);border:1px solid var(--ember-dim);
         border-radius:999px;padding:5px 10px;white-space:nowrap}
  .contest{margin-top:13px;border-top:1px dashed var(--line);padding-top:11px}
  .verdict{margin:0 0 8px;font-size:13.5px;font-weight:560;color:var(--ink)}
  .row{display:flex;gap:9px;align-items:baseline;font-size:13px;padding:3px 0}
  .row .v{color:var(--lose);min-width:58px;font-weight:560}
  .row .r{color:var(--muted)}
  .row.w .v{color:var(--win)}
  .acts{margin-top:13px;display:flex;gap:8px;flex-wrap:wrap}

  button{font:inherit;font-size:12.5px;color:var(--ink);background:var(--panel2);
         border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer}
  button:hover{border-color:var(--ember-dim);color:var(--ember)}
  button.primary{background:var(--ember);border-color:var(--ember);color:#1a0e08;font-weight:600}
  button.primary:hover{color:#1a0e08;filter:brightness(1.08)}
  button.ghost{background:none;color:var(--dim);border-color:transparent;padding:5px 7px}
  button.ghost:hover{color:var(--ember);border-color:var(--line)}

  .say{flex:none;padding:14px 26px 20px;border-top:1px solid var(--line);
       background:var(--bg)}
  .saybox{display:flex;gap:9px;background:var(--panel);border:1px solid var(--line);
          border-radius:10px;padding:9px}
  select,input[type=text]{font:inherit;background:transparent;border:0;color:var(--ink);outline:0}
  select{color:var(--ember);font:12.5px/1 var(--mono);border-right:1px solid var(--line);
         padding-right:10px;cursor:pointer}
  select option{background:var(--panel2)}
  input[type=text]{flex:1;font-size:14.5px}
  input::placeholder{color:var(--dim)}
  .reply{color:var(--muted);font-size:13px;margin:11px 2px 0;min-height:1.5em}
  .reply b{color:var(--ember);font-weight:560}

  .act{border-bottom:1px solid var(--line);padding:11px 0}
  .act:last-child{border-bottom:0}
  .act b{font-weight:560;font-size:13.5px;display:block}
  .act small{color:var(--dim);font-size:12.5px;display:block;margin-top:4px}
  .act time{font:10.5px/1 var(--mono);color:var(--dim)}

  .belief{padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
  .belief:last-child{border-bottom:0}
  .belief .q{font-size:13px;line-height:1.45;color:var(--ink)}
  .belief .m{color:var(--dim);font-size:11.5px;margin-top:3px}
  .belief.dead .q{color:var(--lose)}
  .empty{color:var(--dim);font-size:13px;font-style:italic}
  @media (max-width:1080px){
    main{grid-template-columns:1fr;height:auto;overflow:visible}
    aside,.right{border:0;border-top:1px solid var(--line);overflow:visible}
    .mid{padding:0 0 8px}
    .scroll{overflow:visible;padding:0 20px}
    .mid h2{padding:22px 20px 0}
    .say{position:sticky;bottom:0;padding:12px 20px 16px}
    .strap{margin-left:0;text-align:left}
  }
</style>

<header>
  <div class="mark">Hearth<span>.</span></div>
  <div class="tag" id="proto">mcp 2025-11-25</div>
  <div class="tag" id="auth">connecting</div>
  <div class="strap">The household memory an agent can be trusted with. Who said it,
    when, whether it still holds, and why it won.</div>
</header>

<main>
  <aside>
    <h2>Who lives here</h2>
    <div id="members"></div>
    <h2>Open situations</h2>
    <div id="contexts"></div>
    <h2>Everything ever said</h2>
    <div id="beliefs"></div>
  </aside>

  <div class="mid">
    <h2>What is standing right now</h2>
    <div class="scroll"><div id="slots"></div></div>
    <div class="say">
      <div class="saybox">
        <select id="speaker"></select>
        <input type="text" id="said" autocomplete="off"
               placeholder="say something, the way you would out loud">
        <button class="primary" id="send">Say</button>
      </div>
      <div class="reply" id="reply"></div>
    </div>
  </div>

  <div class="right">
    <h2>What it did, and why</h2>
    <div id="ledger"></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let TOKEN = null, STATE = null;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const ago = t => {
  const s = Date.now()/1000 - t;
  for (const [u,n] of [["week",604800],["day",86400],["hour",3600],["min",60]])
    if (s >= n) { const v = Math.floor(s/n); return `${v} ${u}${v>1?"s":""} ago`; }
  return "just now";
};

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: {"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined,
  });
  return r.json();
}

function render(s) {
  STATE = s;

  // Nothing below phrases a belief. Every sentence on this page arrives already
  // written by hearth/phrasing.py, because a second rendering here would drift
  // from the one Alexa+ is given and the console would stop being evidence.
  $("#members").innerHTML = s.members.map(m => `
    <div class="who">
      <div class="dot">${esc(m.name.slice(0,2).toUpperCase())}</div>
      <div><b>${esc(m.name)}</b>
        <small>${esc(m.role)}</small>
        <div class="${m.grants.length ? "owns" : "nosay"}">${esc(m.authority)}</div>
      </div>
    </div>`).join("");

  $("#contexts").innerHTML = s.contexts.length ? s.contexts.map(c => `
    <div class="ctx"><b>While ${esc(c.name)} lasts</b>
      <small>${c.holds.map(esc).join("<br>")}</small></div>`).join("")
    : `<div class="empty">Nothing is riding on a situation.</div>`;

  $("#slots").innerHTML = s.slots.length ? s.slots.map(x => `
    <div class="slot">
      <div class="slot-top">
        <div>
          <!-- The title already carries the name when a row is about one
               person ("Ada's dinner"), so nothing repeats it here. -->
          <div class="slot-name">${esc(x.title)}</div>
          <!-- The reading is short enough to take in at a glance and short
               enough to be ambiguous read alone, so the sentence goes with it
               for anyone hearing the page rather than looking at it. -->
          <div class="val" title="${esc(x.statement)}"
               aria-label="${esc(x.statement)}">${esc(x.reading)}</div>
        </div>
        ${x.losers.length ? `<div class="basis">${esc(x.verdict.chip)}</div>` : ""}
      </div>
      <p class="said">${esc(x.sentence)}</p>
      ${x.losers.length ? `
        <div class="contest">
          <p class="verdict">${esc(x.verdict.line)}</p>
          <div class="row w"><span class="v">${esc(x.reading)}</span>
            <span class="r">${esc(x.winner.holder)}, ${ago(x.winner.stated_at)}${
              x.winner.context ? `, during ${esc(x.winner.context)}` : ""}</span></div>
          ${x.losers.map(l => `<div class="row"><span class="v">${esc(l.reading)}</span>
            <span class="r">${esc(l.holder)}, but ${esc(l.reason)}</span></div>`).join("")}
        </div>` : ""}
      <div class="acts">
        <button onclick="act('${x.domain}','${x.slot}',${x.about ? `'${esc(x.about)}'` : "null"})">
          Do this now</button>
        ${x.losers.map(l => `<button class="ghost" onclick="retire('${l.id}')">
          stand down ${esc(l.holder)}'s ${esc(l.reading)}</button>`).join("")}
      </div>
    </div>`).join("")
    : `<div class="empty">Nobody has said anything yet. Try
       "keep it at 19" as Dad, then "make it 23" as Ada.</div>`;

  $("#beliefs").innerHTML = s.beliefs.slice().reverse().map(b => `
    <div class="belief ${b.live ? "" : "dead"}">
      <div class="q">${esc(b.said)}</div>
      <div class="m">${esc(b.holder_name)} · ${esc(b.standing)}</div>
    </div>`).join("") || `<div class="empty">Nothing yet.</div>`;

  $("#ledger").innerHTML = s.actions.length ? s.actions.map(a => `
    <div class="act">
      <b>${esc(a.what)}</b>
      <small>${esc(a.why || "no recorded basis")}</small>
      <time>${ago(a.at)}</time>
    </div>`).join("")
    : `<div class="empty">It has not acted yet.</div>`;

  const sel = $("#speaker"), keep = sel.value;
  sel.innerHTML = s.members.map(m => `<option>${esc(m.name)}</option>`).join("");
  if (keep) sel.value = keep;
}

async function say() {
  const said = $("#said").value.trim();
  if (!said) return;
  $("#said").value = "";
  const r = await api("/api/say", {said, speaker: $("#speaker").value});
  // `line` is the same event in the household's words; `reply` is the exact
  // text the MCP tool returned, which is what Alexa+ would hear.
  $("#reply").innerHTML = "<b>&rsaquo;</b> " + esc(r.line || r.reply);
  render(r.state);
}

async function act(domain, slot, about) {
  const r = await api("/api/act", {domain, slot, about});
  $("#reply").innerHTML = "<b>&rsaquo;</b> " + esc(r.reply) +
    (r.why ? `<br><b>why?</b> ${esc(r.why)}` : "");
  render(r.state);
}

async function retire(id) {
  const r = await api("/api/retire", {belief_id: id});
  $("#reply").innerHTML = "<b>&rsaquo;</b> " + esc(r.reply);
  render(r.state);
}

$("#send").onclick = say;
$("#said").addEventListener("keydown", e => { if (e.key === "Enter") say(); });

// --- getting in --------------------------------------------------------
// The console holds no privileged back door. It authenticates the same way an
// Alexa+ client does, with the OAuth 2.1 authorization code flow and PKCE, in
// the browser. That is not ceremony: the first version minted a token from a
// loopback-only endpoint, which was safe but meant the deployed console showed
// a judge a 403 instead of the product. This works for anyone, from anywhere,
// and exercises the real auth path every time the page loads.

const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

async function challengeFor(verifier) {
  return b64url(await crypto.subtle.digest("SHA-256",
    new TextEncoder().encode(verifier)));
}

function randomVerifier() {
  const a = new Uint8Array(48);
  crypto.getRandomValues(a);
  return b64url(a.buffer);
}

async function connect() {
  const here = location.origin + location.pathname;

  // Coming back from /authorize with a code.
  const code = new URLSearchParams(location.search).get("code");
  if (code) {
    const verifier = sessionStorage.getItem("hearth_verifier") || "";
    history.replaceState({}, "", here);               // keep the code out of the bar
    const r = await fetch("/token", {
      method: "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded"},
      body: new URLSearchParams({
        grant_type: "authorization_code", code, code_verifier: verifier,
        client_id: CLIENT_ID, redirect_uri: here, resource: RESOURCE}),
    });
    const t = await r.json();
    if (t.access_token) {
      sessionStorage.setItem("hearth_token", t.access_token);
      return t.access_token;
    }
    throw new Error(t.error_description || t.error || "token exchange failed");
  }

  // Already holding one from earlier in this tab.
  const saved = sessionStorage.getItem("hearth_token");
  if (saved) {
    const ok = await fetch("/api/state", {headers: {Authorization: "Bearer " + saved}});
    if (ok.status !== 401) return saved;
    sessionStorage.removeItem("hearth_token");
  }

  const verifier = randomVerifier();
  sessionStorage.setItem("hearth_verifier", verifier);
  const q = new URLSearchParams({
    client_id: CLIENT_ID, redirect_uri: here, response_type: "code",
    code_challenge: await challengeFor(verifier), code_challenge_method: "S256",
    resource: RESOURCE, scope: "household.read household.write"});
  location.href = "/authorize?" + q;
  return null;
}

let CLIENT_ID = "hearth-dev-client", RESOURCE = location.origin + "/mcp";

(async () => {
  try {
    const meta = await (await fetch("/.well-known/oauth-protected-resource")).json();
    RESOURCE = meta.resource || RESOURCE;
    const asm = await (await fetch("/.well-known/oauth-authorization-server")).json();
    CLIENT_ID = asm.client_id_hint || CLIENT_ID;

    TOKEN = await connect();
    if (!TOKEN) return;                                // redirecting to /authorize
    $("#auth").textContent = "oauth 2.1 · pkce s256";
    render(await api("/api/state"));
  } catch (e) {
    document.body.innerHTML =
      `<p style="padding:40px;color:#a4907f;font:14px system-ui">
         Could not connect: ${String(e.message || e)}</p>`;
  }
})();
</script>
