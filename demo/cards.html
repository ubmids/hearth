<!doctype html>
<!-- Title cards and lower thirds for the demo video, rendered to PNG by
     demo/rough_cut.py: cards.html?card=<name>[&text=...][&sub=...][&tag=...].
     Same palette as the simulated Alexa+ page. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hearth video cards</title>
<style>
  :root{--bg:#0b0d10;--ink:#eef2f6;--dim:#97a3b1;--amber:#ffc04d;--red:#ff6b5e;--green:#5fd38d;--line:#232a33;--cyan:#38d3ff}
  *{box-sizing:border-box}
  html,body{margin:0;width:1920px;height:1080px;font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink)}
  body.full{background:radial-gradient(1200px 700px at 20% 10%,#16202b 0,#0b0d10 60%) var(--bg)}
  body.lower{background:transparent}
  .logo{font-weight:800;font-size:44px;letter-spacing:-.02em}
  .logo b{color:var(--amber)}
  .wrap{position:absolute;inset:0;padding:110px 140px;display:flex;flex-direction:column;justify-content:center;gap:34px}
  h1{margin:0;font-size:88px;line-height:1.04;letter-spacing:-.025em;font-weight:800;max-width:1500px}
  h1 em{font-style:normal;color:var(--amber)}
  p.sub{margin:0;font-size:38px;line-height:1.35;color:var(--dim);max-width:1500px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:40px;max-width:1600px}
  .stat{border:1px solid var(--line);border-radius:22px;padding:40px 44px;background:rgba(255,255,255,.02)}
  .stat .n{font-size:110px;font-weight:800;letter-spacing:-.03em;color:var(--amber);line-height:1}
  .stat .t{font-size:34px;line-height:1.35;margin-top:18px}
  .stat .s{font-size:24px;color:var(--dim);margin-top:14px}
  .tag{position:absolute;top:44px;right:56px;font:700 22px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:#1b1300;background:var(--amber);padding:12px 16px;border-radius:8px}
  .tag.todo{background:var(--red);color:#fff}
  .term{font:400 30px/1.55 ui-monospace,Menlo,monospace;background:#05070a;border:1px solid var(--line);border-radius:18px;padding:34px 40px;max-width:1640px;white-space:pre-wrap}
  .term .ok{color:var(--green)} .term .dim{color:var(--dim)} .term .c{color:var(--cyan)}
  .badges{display:flex;flex-wrap:wrap;gap:16px}
  .badge{font:600 28px/1 ui-monospace,Menlo,monospace;padding:16px 20px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:rgba(255,255,255,.03)}
  .third.right{left:auto;right:64px;bottom:auto;top:430px;max-width:820px}
  .third.low{bottom:22px}
  .third{position:absolute;left:56px;bottom:150px;max-width:1200px;background:rgba(9,11,14,.92);border:1px solid #2c3540;border-left:8px solid var(--amber);border-radius:14px;padding:22px 30px 24px}
  .third .k{font:700 20px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:10px}
  .third .v{font-size:40px;font-weight:700;line-height:1.2}
  .third .w{font-size:26px;color:var(--dim);margin-top:8px;line-height:1.3}
  .foot{position:absolute;left:140px;bottom:70px;font-size:26px;color:var(--dim)}
</style>
</head>
<body>
<script>
const q = new URLSearchParams(location.search);
const card = q.get("card") || "close", text = q.get("text") || "", sub = q.get("sub") || "", tag = q.get("tag") || "";
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const H = {
  third: () => `<div class="third ${esc(q.get("pos") || "right")}"><div class="k">${esc(tag || "hearth")}</div><div class="v">${esc(text)}</div>${sub ? `<div class="w">${esc(sub)}</div>` : ""}</div>`,
  stats: () => `<div class="wrap"><div class="logo">hearth<b>.</b></div>
    <div class="stats">
      <div class="stat"><div class="n">63M</div><div class="t">Americans caring for a family member, nearly 50% more than in 2015</div><div class="s">AARP and the National Alliance for Caregiving, 2025</div></div>
      <div class="stat"><div class="n">1 in 3</div><div class="t">older adults' emergency hospitalisations for an overdose involve warfarin</div><div class="s">Budnitz et al., NEJM 2011</div></div>
    </div></div>`,
  slate: () => `<div class="wrap"><div class="logo">hearth<b>.</b></div><h1>${esc(text)}</h1>${sub ? `<p class="sub">${esc(sub)}</p>` : ""}</div>`,
  tech: () => `<div class="wrap"><div class="logo">hearth<b>.</b> <span style="color:var(--dim);font-weight:500;font-size:32px">the server under the voice</span></div>
    <div class="term" id="term"></div>
    <div class="badges"><span class="badge">MCP 2025-11-25</span><span class="badge">Streamable HTTP</span><span class="badge">OAuth 2.1 + PKCE</span><span class="badge">MCP Apps card</span><span class="badge">UCP checkout</span><span class="badge">Agent Skill</span><span class="badge">signed record</span></div></div>`,
  close: () => `<div class="wrap"><div class="logo" style="font-size:120px">hearth<b>.</b></div>
    <h1 style="font-size:64px;font-weight:700">The memory and the conscience<br>of a family caring for someone.</h1>
    <p class="sub">github.com/ubmids/hearth &nbsp;·&nbsp; an Alexa+ add-on, built as a self-hosted MCP server</p></div>
    <div class="foot">Alexa+ is simulated in this video: add-on tools are available to select partners only. Ride and pharmacy are sandboxes.</div>`,
};
document.body.className = card === "third" ? "lower" : "full";
document.body.innerHTML = (H[card] || H.slate)() + (tag && card !== "third" ? `<div class="tag ${q.get("todo") ? "todo" : ""}">${esc(tag)}</div>` : "");
if (card === "tech") {
  // Lines from scripts/conformance.sh, passed in as text (one per line).
  const lines = (text || "PASS server-initialize\nPASS ping\nPASS tools-list\nPASS resources-list\nPASS server-sse-multiple-streams\nPASS dns-rebinding-protection").split("\n");
  document.getElementById("term").innerHTML = `<span class="dim">$</span> <span class="c">scripts/conformance.sh</span>  <span class="dim"># @modelcontextprotocol/conformance, spec 2025-11-25</span>\n`
    + lines.map(l => l.startsWith("PASS") ? `<span class="ok">PASS</span>${esc(l.slice(4))}` : esc(l)).join("\n");
}
</script>
</body>
</html>
